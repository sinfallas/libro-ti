<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350">
  <defs>
    <!-- Papel hueso técnico editorial -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f4eb"/>
      <stop offset="100%" stop-color="#efeae0"/>
    </linearGradient>

    <!-- Fondo oscuro para el corte subterráneo de la trinchera -->
    <linearGradient id="trenchBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Retícula técnica milimetrada suave sobre papel -->
    <pattern id="blueprintGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.06"/>
    </pattern>

    <!-- Retícula técnica sobre trinchera oscura -->
    <pattern id="darkGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <!-- Franjas de precaución amarillo/negro -->
    <pattern id="hazardStripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#d97706"/>
      <rect x="8" width="8" height="16" fill="#111827"/>
    </pattern>
  </defs>

  <!-- Fondo general papel editorial -->
  <rect width="900" height="1350" fill="url(#paperBg)"/>
  <rect width="900" height="1350" fill="url(#blueprintGrid)"/>

  <!-- Banda superior estilo manual de ingeniería -->
  <rect x="64" y="54" width="772" height="36" fill="#111827"/>
  <text x="82" y="77" font-family="'Liberation Mono', monospace" font-size="12.5" font-weight="bold" fill="#f8fafc" letter-spacing="2.2">ARQUITECTURA, CIBERSEGURIDAD, OPERACIONES Y GOBIERNO</text>
  <rect x="688" y="61" width="140" height="22" rx="2" fill="#dc2626"/>
  <text x="758" y="76" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="11.5" font-weight="bold" fill="#ffffff" letter-spacing="1.6">2.ª ED. · 2026</text>

  <!-- Bloque tipográfico asimétrico editorial (Suizo / Manual de campo) -->
  <g transform="translate(64, 168)">
    <text x="0" y="0" font-family="'Liberation Sans', Arial, sans-serif" font-size="84" font-weight="bold" fill="#0f172a" letter-spacing="-1.5">FUNDAMENTOS</text>
    <text x="0" y="88" font-family="'Liberation Sans', Arial, sans-serif" font-size="84" font-weight="bold" fill="#0f172a" letter-spacing="-1.5">DE</text>
    <rect x="136" y="20" width="132" height="82" rx="4" fill="#dc2626"/>
    <text x="202" y="88" text-anchor="middle" font-family="'Liberation Sans', Arial, sans-serif" font-size="78" font-weight="bold" fill="#ffffff" letter-spacing="1">TI</text>

    <!-- Nota lateral de sello autoral -->
    <line x1="292" y1="26" x2="292" y2="98" stroke="#0f172a" stroke-width="2"/>
    <text x="310" y="48" font-family="'Bitstream Charter', Georgia, serif" font-style="italic" font-size="25" fill="#1e293b">Un recorrido por las excentricidades</text>
    <text x="310" y="80" font-family="'Bitstream Charter', Georgia, serif" font-style="italic" font-size="25" fill="#1e293b">de un entorno de TI</text>
    <text x="310" y="103" font-family="'Liberation Mono', monospace" font-size="11.5" fill="#dc2626" font-weight="bold" letter-spacing="1.4">TEORÍA CORPORATIVA VS. REALIDAD DE TRINCHERA</text>
  </g>

  <line x1="64" y1="300" x2="836" y2="300" stroke="#0f172a" stroke-width="2.5"/>

  <!-- ======================================================================= -->
  <!-- ILUSTRACIÓN CENTRAL: CORTE ARQUITECTÓNICO DEL EDIFICIO DE TI (324..1185) -->
  <!-- ======================================================================= -->
  <g transform="translate(64, 322)">
    <!-- Marco exterior del corte transversal -->
    <rect x="0" y="0" width="772" height="856" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

    <!-- NIVEL 1 (ARRIBA): LA VITRINA EJECUTIVA Y LAS MODAS (y: 0..250) -->
    <rect x="2" y="2" width="768" height="248" fill="#f8fafc"/>
    <rect x="16" y="14" width="318" height="24" rx="2" fill="#e2e8f0"/>
    <text x="26" y="30" font-family="'Liberation Mono', monospace" font-size="11" font-weight="bold" fill="#0f172a" letter-spacing="1">PISO 10 · EL ESPEJISMO DEL DIRECTORIO</text>

    <!-- Nube de humo comercial: IA MÁGICA + CLOUD SIN CUENTAS -->
    <g transform="translate(42, 62)">
      <rect x="0" y="0" width="215" height="108" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 4"/>
      <text x="107" y="28" text-anchor="middle" font-family="'Liberation Sans', sans-serif" font-size="13.5" font-weight="bold" fill="#1d4ed8">MODA DEL TRIMESTRE</text>
      <text x="107" y="52" text-anchor="middle" font-family="'Bitstream Charter', serif" font-style="italic" font-size="15" fill="#1e293b">«Ponle IA mágica a todo</text>
      <text x="107" y="72" text-anchor="middle" font-family="'Bitstream Charter', serif" font-style="italic" font-size="15" fill="#1e293b">para el lunes (sin presupuesto</text>
      <text x="107" y="92" text-anchor="middle" font-family="'Bitstream Charter', serif" font-style="italic" font-size="15" fill="#1e293b">para backups ni switches)»</text>
    </g>

    <!-- Tablero "Efecto Sandía" (Verde por fuera, rojo por dentro) -->
    <g transform="translate(284, 56)">
      <rect x="0" y="0" width="212" height="118" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
      <rect x="0" y="0" width="212" height="24" rx="4" fill="#16a34a"/>
      <text x="106" y="16" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="10.5" font-weight="bold" fill="#ffffff">SLA REPORTADO: 99.9% VERDE</text>
      <!-- Media sandía geométrica -->
      <path d="M 46 52 A 60 48 0 0 0 166 52 Z" fill="#16a34a"/>
      <path d="M 55 52 A 51 39 0 0 0 157 52 Z" fill="#dc2626"/>
      <circle cx="88" cy="66" r="2.5" fill="#111827"/>
      <circle cx="106" cy="72" r="2.5" fill="#111827"/>
      <circle cx="124" cy="66" r="2.5" fill="#111827"/>
      <text x="106" y="108" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="10.5" font-weight="bold" fill="#dc2626">EFECTO SANDÍA (ROJO ADENTRO)</text>
    </g>

    <!-- Dardos de pasillo / WhatsApp cayendo hacia abajo -->
    <g transform="translate(522, 56)">
      <rect x="0" y="0" width="222" height="118" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
      <text x="111" y="22" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="11" font-weight="bold" fill="#991b1b">ATAJOS DE PASILLO</text>
      <text x="16" y="46" font-family="'Liberation Sans', sans-serif" font-size="12.5" fill="#7f1d1d">• «Es un favorcito de 5 min»</text>
      <text x="16" y="68" font-family="'Liberation Sans', sans-serif" font-size="12.5" fill="#7f1d1d">• «Tiene enchufe: llamen a TI»</text>
      <text x="16" y="90" font-family="'Liberation Sans', sans-serif" font-size="12.5" fill="#7f1d1d">• «Todos en TI hacen lo mismo»</text>
      <text x="16" y="110" font-family="'Liberation Sans', sans-serif" font-size="12.5" fill="#7f1d1d">• «Con RAID no hace falta backup»</text>
    </g>

    <!-- Flechas rojas bloqueadas contra la losa de Service Desk -->
    <g stroke="#dc2626" stroke-width="2.5" fill="#dc2626">
      <line x1="580" y1="180" x2="580" y2="236"/>
      <polygon points="574,232 586,232 580,242"/>
      <line x1="675" y1="180" x2="675" y2="236"/>
      <polygon points="669,232 681,232 675,242"/>
    </g>
    <!-- Flecha limpia aprobada por puerta única -->
    <g stroke="#16a34a" stroke-width="3" fill="#16a34a">
      <line x1="150" y1="180" x2="150" y2="236"/>
      <polygon points="144,232 156,232 150,242"/>
    </g>
    <rect x="64" y="188" width="172" height="24" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
    <text x="150" y="204" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="10.5" font-weight="bold" fill="#14532d">TICKET + CASO FINOPS</text>

    <!-- =================================================================== -->
    <!-- LOSA DIVISORIA DE HORMIGÓN: COMPUERTA DE GOBIERNO Y SERVICE DESK     -->
    <!-- =================================================================== -->
    <rect x="0" y="248" width="772" height="44" fill="#0f172a"/>
    <rect x="0" y="248" width="772" height="8" fill="url(#hazardStripes)"/>
    <text x="386" y="278" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="12.5" font-weight="bold" fill="#fbbf24" letter-spacing="1.6">FRONTERA DE GOBIERNO: PUERTA ÚNICA · ZERO TRUST · RACI · SEPARACIÓN SECOPS / GRC</text>

    <!-- =================================================================== -->
    <!-- SUBSUELO (y: 292..854): LA TRINCHERA REAL DE TI                     -->
    <!-- =================================================================== -->
    <rect x="2" y="292" width="768" height="562" fill="url(#trenchBg)"/>
    <rect x="2" y="292" width="768" height="562" fill="url(#darkGrid)"/>

    <!-- Línea divisoria vertical entre "Museo de Antipatrón Contenido" (Izq) e "Ingeniería sin Humo" (Der) -->
    <line x1="336" y1="312" x2="336" y2="834" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- COLUMNA IZQUIERDA SUBSUELO: EXCENTRICIDADES EN CUARENTENA -->
    <rect x="22" y="312" width="292" height="26" rx="3" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="168" y="329" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="11" font-weight="bold" fill="#fca5a5" letter-spacing="1">ZONA DE CUARENTENA (ANTIPATRONES)</text>

    <!-- Vitrina del "Fósil Intocable" -->
    <g transform="translate(30, 356)">
      <rect x="0" y="0" width="276" height="176" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
      <!-- Servidor torre viejo beige -->
      <rect x="24" y="28" width="76" height="122" rx="3" fill="#d6d3d1" stroke="#44403c" stroke-width="2"/>
      <rect x="34" y="40" width="56" height="12" fill="#78716c"/>
      <rect x="34" y="58" width="56" height="12" fill="#78716c"/>
      <circle cx="44" cy="92" r="4" fill="#ef4444"/>
      <circle cx="58" cy="92" r="4" fill="#f59e0b"/>
      <line x1="34" y1="115" x2="90" y2="115" stroke="#57534e" stroke-width="2"/>
      <line x1="34" y1="123" x2="90" y2="123" stroke="#57534e" stroke-width="2"/>
      <line x1="34" y1="131" x2="90" y2="131" stroke="#57534e" stroke-width="2"/>
      <!-- Cartel cinta adhesiva NO APAGAR -->
      <rect x="116" y="28" width="142" height="32" transform="rotate(-3 187 44)" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
      <text x="187" y="49" text-anchor="middle" transform="rotate(-3 187 44)" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#713f12">¡NO APAGAR!</text>
      <text x="120" y="84" font-family="'Liberation Sans', sans-serif" font-size="12.5" font-weight="bold" fill="#f8fafc">El «Fósil Intocable»</text>
      <text x="120" y="104" font-family="'Liberation Sans', sans-serif" font-size="11.5" fill="#cbd5e1">Soporte vencido en 2016,</text>
      <text x="120" y="121" font-family="'Liberation Sans', sans-serif" font-size="11.5" fill="#cbd5e1">bus factor = 1, aislado</text>
      <text x="120" y="138" font-family="'Liberation Sans', sans-serif" font-size="11.5" fill="#fbbf24">en VLAN roja hasta migrar.</text>
    </g>

    <!-- Tarjeta: Torre de Babel + Shadow AI + SSH manual -->
    <g transform="translate(30, 550)">
      <rect x="0" y="0" width="276" height="134" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="16" y="25" font-family="'Liberation Mono', monospace" font-size="11.5" font-weight="bold" fill="#fca5a5">DEUDA Y VICIOS EXTIRPADOS:</text>
      <text x="16" y="48" font-family="'Liberation Sans', sans-serif" font-size="12" fill="#e2e8f0">✕ Microservicios para 80 usuarios</text>
      <text x="16" y="69" font-family="'Liberation Sans', sans-serif" font-size="12" fill="#e2e8f0">✕ VPN plana desde PC familiar</text>
      <text x="16" y="90" font-family="'Liberation Sans', sans-serif" font-size="12" fill="#e2e8f0">✕ 4.000 falsos positivos el viernes</text>
      <text x="16" y="111" font-family="'Liberation Sans', sans-serif" font-size="12" fill="#e2e8f0">✕ Toques por SSH y Shadow AI</text>
    </g>

    <!-- Tarjeta: Regla Vacaciones Desconectadas -->
    <g transform="translate(30, 702)">
      <rect x="0" y="0" width="276" height="124" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1.5"/>
      <text x="16" y="25" font-family="'Liberation Mono', monospace" font-size="11.5" font-weight="bold" fill="#93c5fd">PRUEBA DE FUEGO HUMANA:</text>
      <text x="16" y="50" font-family="'Bitstream Charter', serif" font-style="italic" font-size="14" fill="#f8fafc">«Un senior real se mide por</text>
      <text x="16" y="70" font-family="'Bitstream Charter', serif" font-style="italic" font-size="14" fill="#f8fafc">cuántos días puede apagar su</text>
      <text x="16" y="90" font-family="'Bitstream Charter', serif" font-style="italic" font-size="14" fill="#f8fafc">teléfono en vacaciones sin que</text>
      <text x="16" y="110" font-family="'Bitstream Charter', serif" font-style="italic" font-size="14" fill="#93c5fd">se detenga la empresa.»</text>
    </g>

    <!-- COLUMNA DERECHA SUBSUELO: INGENIERÍA PRAGMÁTICA 2026 -->
    <rect x="358" y="312" width="392" height="26" rx="3" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="554" y="329" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="11" font-weight="bold" fill="#a7f3d0" letter-spacing="1">BASTIÓN OPERATIVO (TECNOLOGÍA ABURRIDA Y SÓLIDA)</text>

    <!-- Bastidor limpio de Infraestructura Híbrida + DevSecOps -->
    <g transform="translate(358, 356)">
      <rect x="0" y="0" width="392" height="222" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- 4 Unidades Rack (1U..4U) -->
      <g transform="translate(18, 18)">
        <rect x="0" y="0" width="356" height="40" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="20" r="4.5" fill="#22c55e"/>
        <circle cx="32" cy="20" r="4.5" fill="#22c55e"/>
        <text x="50" y="24" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#f8fafc">1U · IDENTIDAD FIDO2 + NETBIRD + VLANs</text>
      </g>
      <g transform="translate(18, 66)">
        <rect x="0" y="0" width="356" height="40" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="20" r="4.5" fill="#22c55e"/>
        <circle cx="32" cy="20" r="4.5" fill="#38bdf8"/>
        <text x="50" y="24" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#f8fafc">2U · LINUX LTS + PROXMOX KVM + ZFS</text>
      </g>
      <g transform="translate(18, 114)">
        <rect x="0" y="0" width="356" height="40" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="20" r="4.5" fill="#22c55e"/>
        <circle cx="32" cy="20" r="4.5" fill="#22c55e"/>
        <text x="50" y="24" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#f8fafc">3U · POSTGRESQL + pgvector + RAG LIMPIO</text>
      </g>
      <g transform="translate(18, 162)">
        <rect x="0" y="0" width="356" height="40" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
        <circle cx="18" cy="20" r="4.5" fill="#22c55e"/>
        <circle cx="32" cy="20" r="4.5" fill="#a855f7"/>
        <text x="50" y="24" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#f8fafc">4U · IaC OPENTOFU + CONTENEDORES NO-ROOT</text>
      </g>
    </g>

    <!-- Bóveda Inmutable 3-2-1-1-0 -->
    <g transform="translate(358, 596)">
      <rect x="0" y="0" width="188" height="112" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
      <circle cx="42" cy="56" r="24" fill="#022c22" stroke="#34d399" stroke-width="2.5"/>
      <line x1="42" y1="38" x2="42" y2="74" stroke="#34d399" stroke-width="2"/>
      <line x1="24" y1="56" x2="60" y2="56" stroke="#34d399" stroke-width="2"/>
      <circle cx="42" cy="56" r="6" fill="#34d399"/>
      <text x="78" y="38" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#ecfdf5">BÓVEDA WORM</text>
      <text x="78" y="58" font-family="'Liberation Mono', monospace" font-size="13" font-weight="bold" fill="#34d399">3-2-1-1-0</text>
      <text x="78" y="78" font-family="'Liberation Sans', sans-serif" font-size="11.5" fill="#d1fae5">Inmutable y</text>
      <text x="78" y="94" font-family="'Liberation Sans', sans-serif" font-size="11.5" fill="#d1fae5">DRP probado</text>
    </g>

    <!-- Monitor SRE: OpenTelemetry + Error Budget -->
    <g transform="translate(562, 596)">
      <rect x="0" y="0" width="188" height="112" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="14" y="24" font-family="'Liberation Mono', monospace" font-size="11" font-weight="bold" fill="#7dd3fc">SRE · OPENTELEMETRY</text>
      <polyline points="14,72 42,72 54,44 68,84 82,58 98,70 132,70 146,48 160,70 174,70" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linejoin="round"/>
      <text x="14" y="98" font-family="'Liberation Mono', monospace" font-size="10.5" fill="#cbd5e1">SLO 99.9% · TOIL &lt; 50%</text>
    </g>

    <!-- Base de cimientos: Los 8 Dominios + FinOps + Post-Mortem sin culpa -->
    <g transform="translate(358, 724)">
      <rect x="0" y="0" width="392" height="102" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="196" y="26" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="11.5" font-weight="bold" fill="#f8fafc" letter-spacing="1">8 DOMINIOS · FINOPS · POST-MORTEMS SIN CULPA</text>
      <line x1="24" y1="38" x2="368" y2="38" stroke="#475569" stroke-width="1"/>
      <text x="196" y="60" text-anchor="middle" font-family="'Liberation Sans', sans-serif" font-size="12.5" fill="#cbd5e1">Redundancia física real (Fibra opuesta + 5G/LEO)</text>
      <text x="196" y="83" text-anchor="middle" font-family="'Liberation Sans', sans-serif" font-size="12.5" fill="#38bdf8" font-weight="bold">Estándares abiertos · Cero secuestro de proveedor</text>
    </g>
  </g>

  <!-- Pie editorial de autoría -->
  <line x1="64" y1="1206" x2="836" y2="1206" stroke="#0f172a" stroke-width="2.5"/>
  <text x="64" y="1256" font-family="'Liberation Sans', Arial, sans-serif" font-size="34" font-weight="bold" fill="#0f172a" letter-spacing="1.2">JESÚS A. PALENCIA S.</text>
  <text x="64" y="1286" font-family="'Bitstream Charter', Georgia, serif" font-style="italic" font-size="17" fill="#334155">«Informático de profesión y excéntrico por convicción»</text>

  <g transform="translate(622, 1226)">
    <rect x="0" y="0" width="214" height="58" rx="4" fill="#111827"/>
    <text x="107" y="25" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="12" font-weight="bold" fill="#fbbf24" letter-spacing="1.4">BOOKS AS CODE</text>
    <text x="107" y="45" text-anchor="middle" font-family="'Liberation Mono', monospace" font-size="11.5" fill="#f8fafc" letter-spacing="1.2">LICENCIA CC BY-SA 4.0</text>
  </g>
</svg>
