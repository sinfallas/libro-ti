<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="900" height="1350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2e2c"/>
      <stop offset="48%" stop-color="#134e48"/>
      <stop offset="100%" stop-color="#092524"/>
    </linearGradient>

    <radialGradient id="hubGlow" cx="68%" cy="78%" r="52%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#092524" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="topGlow" cx="50%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0b2e2c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5eead4" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>

    <pattern id="microGrid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M 45 0 L 0 0 0 45" fill="none" stroke="#5eead4" stroke-width="0.5" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Fondo esmeralda profundo (evolución directa de la portada 2022) -->
  <rect width="900" height="1350" fill="url(#bgGrad)"/>
  <rect width="900" height="1350" fill="url(#microGrid)"/>
  <rect width="900" height="1350" fill="url(#hubGlow)"/>
  <rect width="900" height="1350" fill="url(#topGlow)"/>

  <!-- Red geométrica principal inspirada en la convergencia original de 2022 (nodo maestro en 612, 1055) -->
  <g stroke="#5eead4" stroke-linecap="round">
    <!-- Haces principales hacia el nodo de convergencia inferior derecho -->
    <line x1="155" y1="0" x2="612" y2="1055" stroke-width="2.4" stroke-opacity="0.24"/>
    <line x1="690" y1="0" x2="900" y2="455" stroke-width="2.2" stroke-opacity="0.20"/>
    <line x1="365" y1="0" x2="0" y2="575" stroke-width="2.0" stroke-opacity="0.18"/>
    <line x1="0" y1="620" x2="900" y2="495" stroke-width="2.2" stroke-opacity="0.20"/>
    <line x1="0" y1="665" x2="612" y2="1055" stroke-width="2.2" stroke-opacity="0.22"/>
    <line x1="0" y1="880" x2="612" y2="1055" stroke-width="2.0" stroke-opacity="0.20"/>
    <line x1="900" y1="560" x2="612" y2="1055" stroke-width="2.4" stroke-opacity="0.24"/>
    <line x1="900" y1="910" x2="220" y2="1350" stroke-width="2.2" stroke-opacity="0.22"/>
    <line x1="612" y1="1055" x2="735" y2="1350" stroke-width="2.4" stroke-opacity="0.24"/>
    <line x1="612" y1="1055" x2="430" y2="1350" stroke-width="1.6" stroke-opacity="0.16"/>

    <!-- Conexiones secundarias entre los 8 dominios de TI -->
    <line x1="258" y1="238" x2="782" y2="202" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="5 7"/>
    <line x1="152" y1="336" x2="258" y2="238" stroke-width="1.3" stroke-opacity="0.18"/>
    <line x1="782" y1="202" x2="812" y2="388" stroke-width="1.3" stroke-opacity="0.16"/>
    <line x1="812" y1="388" x2="742" y2="832" stroke-width="1.2" stroke-opacity="0.15" stroke-dasharray="4 6"/>
    <line x1="142" y1="756" x2="368" y2="900" stroke-width="1.4" stroke-opacity="0.20"/>
    <line x1="664" y1="658" x2="612" y2="1055" stroke-width="1.4" stroke-opacity="0.18" stroke-dasharray="4 6"/>
    <line x1="664" y1="658" x2="742" y2="832" stroke-width="1.2" stroke-opacity="0.16"/>
  </g>

  <!-- Anillos de observabilidad y control alrededor del nodo maestro -->
  <g fill="none" stroke="#5eead4">
    <circle cx="612" cy="1055" r="46" stroke-width="1.2" stroke-opacity="0.28"/>
    <circle cx="612" cy="1055" r="98" stroke-width="1.0" stroke-opacity="0.16" stroke-dasharray="6 8"/>
    <circle cx="612" cy="1055" r="168" stroke-width="0.9" stroke-opacity="0.10"/>
  </g>

  <!-- Los 8 nodos de dominio + nodo integrador central -->
  <g>
    <!-- Nodo maestro CIO / Gobierno -->
    <circle cx="612" cy="1055" r="11" fill="#0b2e2c" stroke="#5eead4" stroke-width="3" stroke-opacity="0.85"/>
    <circle cx="612" cy="1055" r="4.5" fill="#99f6e4"/>

    <!-- 8 nodos satélite (los 8 dominios de TI en 2026) -->
    <circle cx="258" cy="238" r="5.5" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.65"/>
    <circle cx="782" cy="202" r="5.5" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.60"/>
    <circle cx="152" cy="336" r="5.0" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.55"/>
    <circle cx="812" cy="388" r="5.5" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.60"/>
    <circle cx="142" cy="756" r="5.5" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.60"/>
    <circle cx="664" cy="658" r="5.5" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.58"/>
    <circle cx="742" cy="832" r="6.0" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.70"/>
    <circle cx="368" cy="900" r="6.0" fill="#0f3d39" stroke="#5eead4" stroke-width="2" stroke-opacity="0.70"/>
  </g>

  <!-- Marco editorial arquitectónico fino con marcas de esquina -->
  <rect x="38" y="38" width="824" height="1274" fill="none" stroke="#99f6e4" stroke-width="1.1" stroke-opacity="0.24"/>
  <g stroke="#5eead4" stroke-width="2.2" stroke-opacity="0.65" fill="none">
    <path d="M 38 66 L 38 38 L 66 38"/>
    <path d="M 834 38 L 862 38 L 862 66"/>
    <path d="M 38 1284 L 38 1312 L 66 1312"/>
    <path d="M 834 1312 L 862 1312 L 862 1284"/>
  </g>

  <!-- Bloque superior: Subtítulo (respetando la composición original de 2022) -->
  <g text-anchor="middle" font-family="'Bitstream Charter', 'Liberation Serif', Georgia, serif">
    <text x="450" y="132" fill="#f0fdfa" font-size="25" letter-spacing="5.5">UN RECORRIDO POR LAS</text>
    <text x="450" y="166" fill="#99f6e4" font-size="18.5" letter-spacing="4.2">EXCENTRICIDADES DE UN ENTORNO DE TI</text>
  </g>
  <line x1="230" y1="194" x2="670" y2="194" stroke="url(#lineAccent)" stroke-width="1.4"/>
  <rect x="446" y="190" width="8" height="8" transform="rotate(45 450 194)" fill="#5eead4" fill-opacity="0.85"/>

  <!-- Sello de Segunda Edición (2026) -->
  <g transform="translate(450, 392)">
    <rect x="-215" y="-22" width="430" height="36" rx="4" fill="#071f1e" fill-opacity="0.78" stroke="#5eead4" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Liberation Sans', Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#5eead4" letter-spacing="4.2">SEGUNDA EDICIÓN · 2026</text>
  </g>

  <!-- Bloque central monumental: FUNDAMENTOS / DE / TI -->
  <g text-anchor="middle" font-family="'Bitstream Charter', 'Liberation Serif', Georgia, serif" fill="#ffffff">
    <text x="450" y="535" font-size="88" font-weight="bold" letter-spacing="5.5">FUNDAMENTOS</text>
    <text x="450" y="665" font-size="78" font-weight="normal" fill="#e2e8f0" letter-spacing="8">DE</text>
    <text x="450" y="852" font-size="182" font-weight="bold" letter-spacing="8">TI</text>
  </g>

  <!-- Cinta temática bajo el título principal -->
  <line x1="175" y1="902" x2="725" y2="902" stroke="url(#lineAccent)" stroke-width="1.2"/>
  <text x="450" y="932" text-anchor="middle" font-family="'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="bold" fill="#ccfbf1" fill-opacity="0.88" letter-spacing="4.6">INFRAESTRUCTURA · CIBERSEGURIDAD · OPERACIONES · GOBIERNO</text>

  <!-- Bloque inferior: Autoría y Licencia abierta -->
  <g text-anchor="middle">
    <line x1="340" y1="1202" x2="560" y2="1202" stroke="url(#lineAccent)" stroke-width="1.2"/>
    <text x="450" y="1244" font-family="'Bitstream Charter', 'Liberation Serif', Georgia, serif" font-size="29" fill="#ffffff" letter-spacing="4.8">JESÚS A. PALENCIA S.</text>
    <text x="450" y="1276" font-family="'Liberation Mono', monospace" font-size="12.5" fill="#5eead4" fill-opacity="0.82" letter-spacing="3.2">EDICIÓN ABIERTA · CC BY-SA 4.0</text>
  </g>
</svg>
